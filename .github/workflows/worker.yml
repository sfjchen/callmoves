# Processes calls submitted on the website, up to 4 in parallel per run (1 matrix job each): transcription on the
# runner's CPU (faster-whisper medium, GS Q3-2026 took 25 minutes end to end), speaker diarization when HF_TOKEN
# has access to the gated pyannote model, then bars, claims, scoring, and publishing to Supabase.
# See pipeline/callmoves/worker.py.
name: worker
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.queue.outputs.slots }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: check the queue
        id: queue
        run: |
          n=$(curl -sfI "$SUPABASE_URL/rest/v1/callmoves_submissions?select=id&status=eq.queued" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Prefer: count=exact" \
            | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          n=${n:-0}
          echo "slots=$(python3 -c "print(list(range(min($n, 4))))")" >> "$GITHUB_OUTPUT"
          echo "queued: $n"

  process:
    needs: check
    if: needs.check.outputs.slots != '[]'
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.check.outputs.slots) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults: { run: { working-directory: pipeline } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/pyproject.toml }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-medium-pyannote }
      # CPU-only torch first, so pyannote does not pull the 2 GB CUDA build
      - run: |
          sudo apt-get install -y -q ffmpeg
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[asr,diarize]"
      - run: python -m callmoves.worker
        env: { CALLMOVES_WORK: "${{ runner.temp }}/work" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-folder-${{ matrix.slot }}
          path: ${{ runner.temp }}/work/data
          retention-days: 30
          if-no-files-found: ignore
