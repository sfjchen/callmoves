[project]
name = "callmoves"
version = "0.1.0"
description = "CallMoves pipeline: earnings call transcript + 1-minute prices -> ranked market-moving moments"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pydantic>=2.7", "anthropic>=1.0", "httpx>=0.27", "yfinance>=0.2", "python-dotenv>=1.0", "pypdf>=4.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
callmoves = "callmoves.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["callmoves*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
